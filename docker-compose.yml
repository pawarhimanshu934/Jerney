services:
  db:
    image: postgres:17-alpine
    container_name: jerney-db
    restart: unless-stopped
    environment:
      POSTGRES_DB : jerney_db
      POSTGRES_USER : jerney_user
      POSTGRES_PASSWORD : jerney_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    #Security: read-only root filesystem where possible
    tmpfs:
      - /tmp
      - /run 

  backend:
    build:
      context: ./backend
      dockerfile : Dockerfile
    container_name: jerney-backend
    restart: unless-stopped
    environment:
      DB_HOST : db
      PORT : "5000"
      DB_USER : jerney_user
      DB_PASSWORD : jerney_pass_2026
      DB_NAME : jerney_db 
      DB_PORT: "5432"
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    #Security ; Do not run as root 
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jerney-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
    driver: local  

   
