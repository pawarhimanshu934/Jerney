apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-route
  namespace: gateway-ns
  labels:
    app.kubernetes.io/part-of: jerney
    app.kubernetes.io/name: gateway-route
    app.kubernetes.io/component: gateway

spec:
  parentRefs:
  - name: jerney-gateway

  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: backend-service
      port: 5000

  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend-service
      port: 80