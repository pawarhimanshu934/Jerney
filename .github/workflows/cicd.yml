name: DevSecOps CI/CD Pipeline

#Lint -> SCA -> build and push -> trivy scan docker images -> Scan infra Terraform/K8 using checkovs -> lint docker file -> updates image tag in k8 manifest

on:
  push:
    branches: ["*"]
    paths-ignore:
      - 'kubernetes/**'
  pull_request:
    branches: ["*"]

permissions:
  contents: read
  packages: write # Needed to push images to GHCR
  id-token: write # Needed for cosign keyless signing

#Concurrency used to avoid running multiple pipeline at the same time when multiple code push event happen quicky.
#It ensures to execute pipeline only for latest commit and ignore others.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/jerney-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/jerney-frontend

jobs:
# ==============================================================
# STAGE 1: Linting
# ==============================================================
  lint:
    name: "Code Linting"
    runs-on: ubuntu-latest
    continue-on-error: true #added just for testing, this shoudn't be present in prod pipeline. 
    strategy:
      matrix:
        component: [backend, frontend] 
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    
    - name: Setup NodeJs
      uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: "${{ matrix.component }}/package-lock.json"

    - name: Install Dependencies
      working-directory: ${{ matrix.component }}
      run: npm ci
    
    - name: Run ES-lint
      working-directory: ${{ matrix.component }}
      run: npm run lint 

# ==============================================================
# STAGE 2: Unit Test
# ==============================================================
  unit-test:
    name: "Running Unit test on ${{ matrix.component }}"
    runs-on: ubuntu-latest
    continue-on-error: true #added just for testing, this shoudn't be present in prod pipeline. 
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
    - name: "Checkout Code"
      uses: actions/checkout@v7

    - name: Setup Nodejs
      uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: "${{ matrix.component }}"
    
    - name: Install Dependencies 
      working-directory: ${{ matrix.component }}
      run: npm ci
    
    - name: Run Unit Tests
      working-directory: ${{ matrix.component }}
      run: npm test -- --coverage


# ==============================================================
# STAGE 3: Software Composition Analysis(SCA) - Dependency Audit
# ==============================================================
  sca:
    name: "Auditing Dependencies"
    runs-on: ubuntu-latest
    needs: unit-test
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup NodeJs
      uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: ${{ matrix.component }}/package-lock.json
    
    - name: Install Dependencies
      working-directory: ${{ matrix.component }}
      run: npm ci
      
      # npm audit for known vulnerabilities (fail on high/critical)
    - name: Audit for known vulnerabilities
      working-directory: ${{ matrix.component }}
      run: npm audit --audit-level=high || echo "Vulnerabilities found, but continuing pipeline" #Just for testing, "echo" will be removed in production.
       

# ==============================================================
# STAGE 4: Build and Push - Docker Images on GitHub Container Registry 
# ==============================================================
  build:
    if: github.actor != 'github-actions[bot]'
    name: "Build ${{ matrix.component }}"
    runs-on: ubuntu-latest
    needs: sca
    permissions:
      contents: read
      packages: write # Needed to push images to GHCR
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with: 
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract Metadata (tags, labels) 
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: "ghcr.io/${{ github.repository }}/jerney-${{ matrix.component }}"
        tag: |                  #tag by commitID, branchName and latest( if main branch )
          type=sha,prefix=  
          type=ref,event=branch
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and Push Docker Image
      id: build
      uses: docker/build-push-action@v7
      with:
        context: ./${{ matrix.component }}
        file: ./${{ matrix.component }}/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}         #pulling tags from the previous step and apply them to this Docker image
        labels: ${{ steps.meta.outputs.labels }}    #metadata attached to Docker images   
        cache-from: type=gha #Docker builds are slow because every time (dependencies reinstall, layers rebuild). This step pulls cached layers from GitHub Actions cache due to which build becomes much faster.
        cache-to: type=gha,mode=max # After build, this step save new layers back to GitHub cache, mode=max saves maximum layers possible. Better reuse in future builds
        # Security: provenance and SBOM
        provenance: true  
        sbom: true 
    
    - name: Extract digest
      run: echo "DIGEST=${{ steps.build.outputs.digest }}" >> $GITHUB_ENV

#   # ==============================================================
#   # STAGE 5: Cosigning Container Images
#   # ==============================================================
  cosign:
    name: Signing Container images
    runs-on: ubuntu-latest
    needs: build 
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with: 
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Cosign
      uses: sigstore/cosign-installer@v3

    - name: Sign Images ( Keyless )
      run : |
        cosign sign --yes ghcr.io/${{ github.repository }}/jerney-${{ matrix.component }}:himanshu

#   # ==============================================================
#   # STAGE 6: Container Image Scanning (Trivy)
#   # ==============================================================
  image-scan:
    name: Scanning ${{ matrix.component }} Image using Trivy
    runs-on: ubuntu-latest
    continue-on-error: true #added just for testing, this shoudn't be present in prod pipeline. 
    needs: build 
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
    - name: Run Trivy vulnerability scanner on build Images
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'ghcr.io/${{ github.repository }}/jerney-${{ matrix.component }}:${{ github.ref_name }}'
        format: 'sarif'
        output: trivy-${{ matrix.component }}.sarif
        exit-code: '1' # Fails the build if vulnerabilities are found
        ignore-unfixed: true
        vuln-type: "os,library"
        severity: 'CRITICAL'
        timeout: "10m"

      #Upload Trviy results on repository security tab instead of CLI
    - name: Upload Trivy Results on Security Tab 
      uses: github/codeql-action/upload-sarif@v3
      with: 
        sarif_file: trivy-${{ matrix.component }}.sarif


#   # ==============================================================
#   # STAGE 7: IaC Security Scan (Checkov) — Terraform + K8s
#   # ==============================================================

  iac-scan:
    name: IAC Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true #added just for testing, this shoudn't be present in prod pipeline. 
    needs: lint
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    
    - name: Scanning Terraform using Checkov
      uses: bridgecrewio/checkov-action@master
      with:
        directory: terraform
        framework: terraform
        soft_fail: false
        skip_check: CKV_AWS_39,CKV_AWS_58  # Public EKS endpoint (intentional for dev)
        output_format: cli
      
    - name: Scanning Kubernetes using Checkov 
      uses: bridgecrewio/checkov-action@master
      with:
        directory: kubernetes
        framework: kubernetes
        soft_fail: true # Soft fail for K8s (some checks may not apply)
        output_format: cli


#   # ==============================================================
#   # STAGE 6: Dockerfile Scan - Hadolint - Syntax linting and strict Dockerfile best practices
#   # ==============================================================

  dockerfile-lint:
    name: Scan Dockerfile using Hadolint 
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        component: [backend, frontend]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    
    - name: Scanning ${{ matrix.component }} Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: ${{ matrix.component }}/Dockerfile
        failure-threshold: warning


#   # ==============================================================
#   # STAGE 7: Update K8s Manifest with New Image Tag
#   # Only runs on push to main (not on PRs)
#   # ==============================================================

  update-manifest:
    if: github.actor != 'github-actions[bot]'
    name: Update Image tag on k8 manifest on each build
    runs-on: ubuntu-latest
    needs: [build, image-scan, iac-scan, dockerfile-lint] 
    permissions:
      contents: write # Needed to push manifest changes

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Get short SHA
      id: sha
      run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Update K8 manifest with new image tags
      run: |
        IMAGE_TAG=${{ steps.sha.outputs.short }}

        # Update backend image
        sed -i "s|image: .*jerney-backend.*|image: ${BACKEND_IMAGE}:${IMAGE_TAG}|g" kubernetes/05-backend-deployment.yml

        # Update frontend image
        sed -i "s|image: .*jerney-frontend.*|image: ${FRONTEND_IMAGE}:${IMAGE_TAG}|g" kubernetes/04-frontend-deployment.yml

        echo "✅ Updated images to tag: ${IMAGE_TAG}"

    - name: Commit and Push updated manifest
      run: |
        git config --global user.name "Github Actions"
        git config --global user.email "actions@github"

        git add kubernetes/*
        git commit -m "Updated Kubernetes manifests with new image tags for commit ${{ steps.sha.outputs.short }} [skip ci]" || echo "No changes to commit"
        git push origin ${{ github.ref_name }}


