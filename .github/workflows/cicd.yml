name: CI/CD Pipeline

#Lint -> SCA -> build and push -> trivy scan docker images -> Scan infra Terraform/K8 using checkovs -> lint docker file -> updates image tag in k8 manifest

on:
  push:
    branches: ["*"]
    paths-ignore:
      - 'kubernetes/**'
  pull_request:
    branches: ["*"]

env:
  DOCKER_REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/jerney-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/jerney-frontend

jobs:
# ==============================================================
# STAGE 1: Linting
# ==============================================================
  lint:
    name: "Code Linting"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        component: [backend, frontend] 
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    
    - name: Setup NodeJs
      uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: "${{ matrix.component }}/package-lock.json"

    - name: Install Dependencies
      working-directory: ${{ matrix.component }}
      run: npm ci
    
    - name: Run ES-lint
      working-directory: ${{ matrix.component }}
      run: npm run lint 

# ==============================================================
# STAGE 2: Software Composition Analysis(SCA) - Dependency Audit
# ==============================================================
  sca:
    name: "Auditing Dependencies"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup NodeJs
      uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: ${{ matrix.component }}/package-lock.json
    
    - name: Install Dependencies
      working-directory: ${{ matrix.component }}
      run: npm ci
      
      # npm audit for known vulnerabilities (fail on high/critical)
    - name: Audit for known vulnerabilities
      working-directory: ${{ matrix.component }}
      run: npm audit --audit-level=high || echo "Vulnerabilities found, but continuing pipeline"
      

# ==============================================================
# STAGE 3: Build and Push - Docker Images on GitHub Container Registry 
# ==============================================================
  build:
    if: github.actor != 'github-actions[bot]'
    name: "Build ${{ matrix.component }}"
    runs-on: ubuntu-latest
    needs: sca
    permissions:
      contents: read
      packages: write # Needed to push images to GHCR
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with: 
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract Metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: "ghcr.io/${{ github.repository }}/jerney-${{ matrix.component }}"
        tag: |
          type=sha,prefix=
          type=ref,event=branch
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v7
      with:
        context: ./${{ matrix.component }}
        file: ./${{ matrix.component }}/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}         #pulling tags from the previous step and apply them to this Docker image
        labels: ${{ steps.meta.outputs.labels }}    #metadata attached to Docker images   
        cache-from: type=gha #Docker builds are slow because every time (dependencies reinstall, layers rebuild). This step pulls cached layers from GitHub Actions cache due to which build becomes much faster.
        cache-to: type=gha,mode=max # After build, this step save new layers back to GitHub cache, mode=max saves maximum layers possible. Better reuse in future builds
        # Security: provenance and SBOM
        provenance: true  
        sbom: true 

#   # ==============================================================
#   # STAGE 4: Container Image Scanning (Trivy)
#   # ==============================================================
  image-scan:
    name: Scanning ${{ matrix.component }} Image using trivy
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build 
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Build image for scanning 
      run: |
        docker build -t jerney-${{ matrix.component }}:scan ./${{ matrix.component }}
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'jerney-${{ matrix.component }}:scan'
        format: 'table'
        exit-code: '1' # Fails the build if vulnerabilities are found
        ignore-unfixed: true
        vuln-type: "os,library"
        severity: 'CRITICAL'
        timeout: "10m"


#   # ==============================================================
#   # STAGE 5: IaC Security Scan (Checkov) — Terraform + K8s
#   # ==============================================================

  iac-scan:
    name: IAC Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: lint
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    
    - name: Scanning Terraform using Checkov
      uses: bridgecrewio/checkov-action@master
      with:
        directory: terraform
        framework: terraform
        soft_fail: false
        skip_check: CKV_AWS_39,CKV_AWS_58  # Public EKS endpoint (intentional for dev)
        output_format: cli
      
    - name: Scanning Kubernetes using Checkov 
      uses: bridgecrewio/checkov-action@master
      with:
        directory: kubernetes
        framework: kubernetes
        soft_fail: true # Soft fail for K8s (some checks may not apply)
        output_format: cli


#   # ==============================================================
#   # STAGE 6: Dockerfile Scan - Hadolint - Syntax linting and strict Dockerfile best practices
#   # ==============================================================

  dockerfile-lint:
    name: Scan Dockerfile using Hadolint 
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        component: [backend, frontend]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    
    - name: Scanning ${{ matrix.component }} Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: ${{ matrix.component }}/Dockerfile
        failure-threshold: warning


#   # ==============================================================
#   # STAGE 7: Update K8s Manifest with New Image Tag
#   # Only runs on push to main (not on PRs)
#   # ==============================================================

  update-manifest:
    if: github.actor != 'github-actions[bot]'
    name: Update Image tag on k8 manifest on each build
    runs-on: ubuntu-latest
    needs: [build, image-scan, iac-scan, dockerfile-lint] 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Get short SHA
      id: sha
      run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Update K8 manifest with new image tags
      run: |
        IMAGE_TAG=${{ steps.sha.outputs.short }}

        # Update backend image
        sed -i "s|image: .*jerney-backend.*|image: ${BACKEND_IMAGE}:${IMAGE_TAG}|g" kubernetes/05-backend-deployment.yml

        # Update frontend image
        sed -i "s|image: .*jerney-frontend.*|image: ${FRONTEND_IMAGE}:${IMAGE_TAG}|g" kubernetes/04-frontend-deployment.yml

        echo "✅ Updated images to tag: ${IMAGE_TAG}"

    - name: Commit and Push updated manifest
      run: |
        git config --global user.name "Github Actions"
        git config --global user.email "actions@github"

        git add kubernetes/*
        git commit -m "Updated Kubernetes manifests with new image tags for commit ${{ steps.sha.outputs.short }}" || echo "No changes to commit"
        git push origin himanshu




# Notes: 

# cache-from → use old cache
# cache-to   → save new cache

# 👉 This is bi-directional caching


# Provenance 
#= birth certificate of your Docker image
#"Where did this image come from?” It stores -> Who built the image, When it was built, Source repo, Commit  ( Required in modern DevSecOps )
# Why important?
# Supply chain security 🔥
# Required in modern DevSecOps
# Prevents tampered images


# SBOM = ingredients list of your app
#Software Bill of Materials, it lists -> What’s inside this image? -> OS packages, Node modules, Dependencies
# Why important?
# Vulnerability scanning (Trivy uses this)
# Compliance
# Security audits

#Checkov
#Checkov is a tool used to scan Infrastructure as Code (IaC), container images, and open-source packages for security and compliance misconfigurations.

# soft_fail : it controls Checkov breaks your CI pipeline when it finds issues. If true it wont break, if false then there will be strict scanning.

# soft_fail: false

# 👉 If ANY policy fails:

# ❌ Step fails
# ❌ Pipeline fails
# ❌ Deployment blocked

# ✔️ Use this for:

# Terraform (in your case)
# Production environments
# Security-critical infra


# soft_fail: true

# 👉 If issues are found:

# ⚠️ Issues are shown
# ✅ Pipeline CONTINUES

# ✔️ Use this for:

# Kubernetes manifests (like you did)
# Early-stage projects
# When some checks are not applicable



# skip_check -> Tells Checkov: “Don’t flag these specific security checks” 
# skip_check: CKV_AWS_39,CKV_AWS_58

# You are skipping:
# CKV_AWS_39 → EKS public endpoint
# CKV_AWS_58 → Another AWS-related security rule

# Skipping = you accept the risk

# CKV_AWS_39 -> It’s a policy ID defined by Checkov. Checkov has a huge built-in library of security rules, and each rule gets a unique ID like:
# CKV_<PROVIDER>_<NUMBER>


# output_format — How results are displayed

# ✅ What it does

# Controls how scan results are formatted.

# Common options:
# Format	Description
# cli	Human-readable terminal output
# json	Machine-readable (for tools, dashboards)
# sarif	GitHub Security tab integration
# junitxml	CI test reporting